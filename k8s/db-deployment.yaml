apiVersion: apps/v1
kind: Deployment

metadata:
  name: db-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: database

  template:
    metadata:
      labels:
        app: database

    spec:
      containers:
      - name: postgres
        image: postgres:14-alpine
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_DB
          value: "todo"

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_USER

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD

        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data

        - name: db-init-script-volume
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql

      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: db-pvc

      - name: db-init-script-volume
        configMap:
          name: db-init-script-configmap

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script-configmap

data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS todos (
      id SERIAL PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      completed BOOLEAN DEFAULT FALSE
    );

    INSERT INTO todos (title, completed) VALUES
    ('Learn Docker', FALSE),
    ('Build ToDo App', TRUE);