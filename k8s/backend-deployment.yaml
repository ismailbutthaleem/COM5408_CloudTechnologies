apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: backend-image
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5000

        env:
        - name: ALLOWED_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: configmap-backend
              key: ALLOWED_ORIGIN

        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: configmap-backend
              key: DB_HOST

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: configmap-backend
              key: DB_NAME

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: configmap-backend
              key: DB_PORT

        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: configmap-backend
              key: PORT

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD